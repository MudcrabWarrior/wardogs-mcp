# Builds the Claude Desktop bundle and attaches it to a GitHub Release.
# Trigger: push a tag like v0.1.0 (git tag v0.1.0 && git push --tags),
# or run it by hand from the Actions tab.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run extract
      - run: npm run bundle
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/wardogs-mcp.mcpb
          generate_release_notes: true
      - name: Keep as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: wardogs-mcp.mcpb
          path: release/wardogs-mcp.mcpb
